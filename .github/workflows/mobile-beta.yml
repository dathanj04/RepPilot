name: Private mobile beta builds
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'mobile/**'
      - 'capacitor.config.ts'
      - 'scripts/mobile-*'
      - 'package*.json'
      - '.github/workflows/mobile-beta.yml'
permissions:
  contents: read
concurrency:
  group: mobile-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/mobile-icons.py
      - run: node scripts/mobile-preflight.mjs --android
      - run: npx --no-install cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reppilot-android-private-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 -m venv /tmp/reppilot-icons && /tmp/reppilot-icons/bin/pip install Pillow==11.3.0
      - run: /tmp/reppilot-icons/bin/python scripts/mobile-icons.py
      - run: node scripts/mobile-preflight.mjs --ios
      - run: npx --no-install cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reppilot-ios-simulator
          path: ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7
